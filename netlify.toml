[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    # Required for SharedArrayBuffer (the multithreaded Pikafish engine).
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"

[[headers]]
  for = "/engine/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

