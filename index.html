<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111518" />
    <link rel="icon" type="image/webp" href="/favicon.webp" sizes="48x48" />
    <meta
      name="description"
      content="一张实木棋盘上的 3D 中国象棋，支持本机双人对弈。"
    />
    <title>tako-xiangqi · 3D 中国象棋</title>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        window.dataLayer.push(arguments);
      }
      gtag("js", new Date());
      window.dataLayer.push({
        "gtm.start": new Date().getTime(),
        event: "gtm.js",
      });
    </script>
    <script
      async
      src="https://www.googletagmanager.com/gtm.js?id=GTM-WZPB5HT8"
    ></script>
  </head>
  <body>
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-WZPB5HT8"
        height="0"
        width="0"
        title="Google Tag Manager"
        style="display: none; visibility: hidden"
      ></iframe>
    </noscript>
    <div class="loading-screen" id="loading-screen">
      <div
        class="loading-content"
        id="loading-meter"
        role="progressbar"
        aria-label="页面资源加载进度"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="loading-cup" aria-hidden="true">
          <div class="loading-bowl">
            <div class="loading-water" id="loading-meter-fill"></div>
          </div>
          <span class="loading-foot"></span>
        </div>
        <span class="loading-percent" id="loading-percent" aria-hidden="true">0%</span>
        <span class="loading-status" id="loading-status" role="status" aria-live="polite">棋局正在展开…</span>
      </div>
    </div>
    <div class="app-shell">
      <div class="board-viewport" id="board-viewport" aria-hidden="true">
        <canvas id="board-canvas"></canvas>
      </div>

      <main class="menu-screen" id="menu-screen">
        <section class="menu-panel" aria-label="选择游戏模式">
          <h1 data-i18n="中国象棋">中国象棋</h1>
          <div class="language-picker" role="group" aria-label="Language">
            <button type="button" data-language="zh" lang="zh-CN" aria-pressed="true">中文</button>
            <button type="button" data-language="en" lang="en" aria-pressed="false">English</button>
          </div>
          <div class="mode-list">
            <button class="mode-button mode-local" id="btn-local" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="8" cy="7" r="3" />
                <path d="M2 20v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M18 13a5 5 0 0 1 4 5v2" />
              </svg>
              <span data-i18n="本机对战">本机对战</span>
              <svg class="mode-arrow" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14m-6-6 6 6-6 6" />
              </svg>
            </button>
            <button class="mode-button mode-ai" id="btn-ai" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3v3M5 9h14v11H5zM2 12v5m20-5v5M8 16h8" />
                <path d="M8 12h1m6 0h1" />
              </svg>
              <span data-i18n="人机对战">人机对战</span>
              <svg class="mode-arrow" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14m-6-6 6 6-6 6" />
              </svg>
            </button>
            <button class="mode-button mode-settings" id="btn-settings" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h10m4 0h2M4 17h2m4 0h10M14 4v6m-4 4v6" />
              </svg>
              <span data-i18n="画面设置">画面设置</span>
              <svg class="mode-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" /></svg>
            </button>
          </div>
          <div class="mode-list" id="level-list" hidden>
            <div class="side-setting">
              <span id="ai-side-label" data-i18n="执棋方">执棋方</span>
              <fieldset class="side-picker" aria-labelledby="ai-side-label">
                <label>
                  <input class="sr-only" id="ai-side-red" type="radio" name="ai-side" value="red" checked />
                  <span data-i18n="红方">红方</span>
                </label>
                <label>
                  <input class="sr-only" id="ai-side-black" type="radio" name="ai-side" value="black" />
                  <span data-i18n="黑方">黑方</span>
                </label>
              </fieldset>
            </div>
            <button class="mode-button mode-level" data-level="easy" type="button">
              <span data-i18n="简单">简单</span>
              <svg class="mode-arrow" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14m-6-6 6 6-6 6" />
              </svg>
            </button>
            <button class="mode-button mode-level" data-level="normal" type="button">
              <span data-i18n="普通">普通</span>
              <svg class="mode-arrow" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14m-6-6 6 6-6 6" />
              </svg>
            </button>
            <button class="mode-button mode-level" data-level="hard" type="button">
              <span data-i18n="困难">困难</span>
              <svg class="mode-arrow" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14m-6-6 6 6-6 6" />
              </svg>
            </button>
            <button class="mode-button mode-back" id="btn-level-back" type="button" aria-label="返回">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12H5m6-6-6 6 6 6" />
              </svg>
            </button>
          </div>
          <div class="mode-list" id="settings-list" hidden>
            <button class="mode-button mode-toggle" data-quality="ssao" type="button" role="switch" aria-checked="true">
              <span data-i18n="环境光遮蔽">环境光遮蔽</span>
              <i class="level" aria-hidden="true"><b></b><b></b></i>
            </button>
            <button class="mode-button mode-toggle" data-quality="dof" type="button" role="switch" aria-checked="true">
              <span data-i18n="景深">景深</span>
              <i class="switch" aria-hidden="true"></i>
            </button>
            <button class="mode-button mode-toggle" data-quality="antialias" type="button" role="switch" aria-checked="true">
              <span data-i18n="抗锯齿">抗锯齿</span>
              <i class="switch" aria-hidden="true"></i>
            </button>
            <button class="mode-button mode-toggle" data-quality="volumetric" type="button" role="switch" aria-checked="true">
              <span data-i18n="体积光">体积光</span>
              <i class="switch" aria-hidden="true"></i>
            </button>
            <label class="resource-source" id="resource-source-setting" for="resource-source">
              <span data-i18n="资源线路">资源线路</span>
              <select id="resource-source">
                <option value="auto" data-i18n="自动">自动</option>
                <option value="cn" data-i18n="中国大陆 · 阿里云">中国大陆 · 阿里云</option>
                <option value="global" data-i18n="海外 · Netlify">海外 · Netlify</option>
              </select>
            </label>
            <button class="mode-button mode-back" id="btn-settings-back" type="button" aria-label="返回">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12H5m6-6-6 6 6 6" />
              </svg>
            </button>
          </div>
          <div class="engine-loading" id="engine-loading" hidden role="status">
            <div class="engine-loading-bar"><span id="engine-loading-fill"></span></div>
            <strong id="engine-loading-percent">0%</strong>
          </div>
          <p class="engine-error" id="engine-error" role="alert" data-i18n="棋手加载失败，请重试" hidden>棋手加载失败，请重试</p>
        </section>
        <div class="renderer-error" id="renderer-error" role="alert" hidden></div>
      </main>

      <main class="game-screen" id="game-screen" hidden>
        <h1 class="sr-only" data-i18n="中国象棋 · tako-xiangqi">中国象棋 · tako-xiangqi</h1>
        <div class="hud-home">
          <button
            class="hud-button back-button"
            id="btn-menu"
            type="button"
            aria-label="返回主菜单"
            title="返回主菜单"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m14 5-7 7 7 7M7 12h13" />
            </svg>
          </button>
          <span class="hud-mark" aria-hidden="true" data-i18n="中国象棋">中国象棋</span>
        </div>

        <div class="hud-turn">
          <button
            class="hud-button view-button"
            id="btn-view"
            type="button"
            aria-label="恢复视角"
            title="恢复视角"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" />
              <path d="M14.6 11.2A3.2 3.2 0 1 0 15.2 13.5M15.2 10.2v1.3h-1.3" />
            </svg>
            <span class="view-label" data-i18n="恢复视角">恢复视角</span>
          </button>
          <div class="turn-statuses" id="turn-statuses" role="status" aria-label="当前回合">
            <span class="turn-state turn-state-red is-active" id="red-turn-state" data-i18n="红方行棋">红方行棋</span>
            <span class="turn-state turn-state-black" id="black-turn-state" data-i18n="黑方行棋">黑方行棋</span>
          </div>
        </div>

        <div class="sr-only" id="selection-note" aria-live="polite" hidden></div>

        <div class="hud-players" aria-label="棋手">
          <div class="win-estimates" id="win-estimates" role="group" aria-label="胜率估计" aria-live="polite" hidden>
            <span class="win-estimate win-estimate-red" id="red-win-rate" aria-label="红方胜率估计">—</span>
            <span class="win-estimate win-estimate-black" id="black-win-rate" aria-label="黑方胜率估计">—</span>
          </div>
          <div class="player-rosters">
            <span class="player-chip" id="red-player">
              <span class="player-marker" aria-hidden="true"></span>
              <span class="roster" id="red-roster"></span>
            </span>
            <span class="player-chip" id="black-player">
              <span class="player-marker" aria-hidden="true"></span>
              <span class="roster" id="black-roster"></span>
            </span>
          </div>
        </div>
        <div class="hud-actions">
          <div class="hint-controls" id="hint-controls" hidden>
            <button class="hud-button" id="btn-hint-settings" type="button" aria-label="提示难度" title="提示难度" aria-controls="hint-settings" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9.5 3h5l.5 2 1.5 1 2-.5 2.5 4-1.5 1.5v2l1.5 1.5-2.5 4-2-.5-1.5 1-.5 2h-5L9 19l-1.5-1-2 .5-2.5-4L4.5 13v-2L3 9.5l2.5-4 2 .5L9 5z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
            <fieldset class="hint-levels" id="hint-settings" aria-label="提示难度" hidden>
              <label><input class="sr-only" type="radio" name="hint-level" value="easy" /><span data-i18n="简单">简单</span></label>
              <label><input class="sr-only" type="radio" name="hint-level" value="normal" checked /><span data-i18n="普通">普通</span></label>
              <label><input class="sr-only" type="radio" name="hint-level" value="hard" /><span data-i18n="困难">困难</span></label>
            </fieldset>
            <button class="hud-button action-button" id="btn-hint" type="button" aria-label="提示" title="提示" disabled>
              <span data-i18n="提示">提示</span>
            </button>
          </div>
          <span class="hint-feedback" id="hint-error" role="status" hidden data-i18n="提示计算失败，请重试">提示计算失败，请重试</span>
          <button
            class="hud-button action-button"
            id="btn-undo"
            type="button"
            aria-label="悔棋"
            title="悔棋"
            disabled
          >
            <span data-i18n="悔棋">悔棋</span>
          </button>
          <button
            class="hud-button action-button"
            id="btn-new-game"
            type="button"
            aria-label="重开"
            title="重开"
          >
            <span data-i18n="重开">重开</span>
          </button>
        </div>
      </main>
    </div>

    <dialog
      class="result-dialog"
      id="result-dialog"
      aria-labelledby="result-title"
    >
      <span class="result-emblem" id="result-emblem" aria-hidden="true">帅</span>
      <h2 id="result-title">红方获胜</h2>
      <button class="dialog-button" id="btn-rematch" type="button">
        <span data-i18n="再来一局">再来一局</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h14m-6-6 6 6-6 6" />
        </svg>
      </button>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
