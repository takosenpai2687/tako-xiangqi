<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111518" />
    <meta
      name="description"
      content="一张实木棋盘上的 3D 中国象棋，支持本机双人对弈。"
    />
    <title>tako-xiangqi · 3D 中国象棋</title>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        window.dataLayer.push(arguments);
      }
      gtag("js", new Date());
      window.dataLayer.push({
        "gtm.start": new Date().getTime(),
        event: "gtm.js",
      });
    </script>
    <script
      async
      src="https://www.googletagmanager.com/gtm.js?id=GTM-WZPB5HT8"
    ></script>
  </head>
  <body>
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-WZPB5HT8"
        height="0"
        width="0"
        title="Google Tag Manager"
        style="display: none; visibility: hidden"
      ></iframe>
    </noscript>
    <div class="loading-screen" id="loading-screen">
      <div
        class="loading-content"
        id="loading-meter"
        role="progressbar"
        aria-label="页面资源加载进度"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="loading-cup" aria-hidden="true">
          <div class="loading-bowl">
            <div class="loading-water" id="loading-meter-fill"></div>
          </div>
          <span class="loading-foot"></span>
        </div>
        <span class="loading-percent" id="loading-percent" aria-hidden="true">0%</span>
        <span class="loading-status" id="loading-status" role="status" aria-live="polite">棋局正在展开…</span>
      </div>
    </div>
    <div class="app-shell">
      <div class="board-viewport" id="board-viewport" aria-hidden="true">
        <canvas id="board-canvas"></canvas>
      </div>

      <main class="menu-screen" id="menu-screen">
        <section class="menu-panel" aria-label="选择游戏模式">
          <h1>中国象棋</h1>
          <div class="mode-list">
            <button class="mode-button mode-local" id="btn-local" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="8" cy="7" r="3" />
                <path d="M2 20v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M18 13a5 5 0 0 1 4 5v2" />
              </svg>
              <span>本机对战</span>
              <svg class="mode-arrow" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14m-6-6 6 6-6 6" />
              </svg>
            </button>
            <button class="mode-button mode-ai" id="btn-ai" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3v3M5 9h14v11H5zM2 12v5m20-5v5M8 16h8" />
                <path d="M8 12h1m6 0h1" />
              </svg>
              <span>人机对战</span>
              <svg class="mode-arrow" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14m-6-6 6 6-6 6" />
              </svg>
            </button>
          </div>
          <div class="mode-list" id="level-list" hidden>
            <button class="mode-button mode-level" data-level="easy" type="button">
              <span>简单</span>
              <svg class="mode-arrow" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14m-6-6 6 6-6 6" />
              </svg>
            </button>
            <button class="mode-button mode-level" data-level="normal" type="button">
              <span>普通</span>
              <svg class="mode-arrow" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14m-6-6 6 6-6 6" />
              </svg>
            </button>
            <button class="mode-button mode-level" data-level="hard" type="button">
              <span>困难</span>
              <svg class="mode-arrow" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14m-6-6 6 6-6 6" />
              </svg>
            </button>
            <button class="mode-button mode-back" id="btn-level-back" type="button" aria-label="返回">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12H5m6-6-6 6 6 6" />
              </svg>
            </button>
          </div>
          <div class="engine-loading" id="engine-loading" hidden role="status">
            <div class="engine-loading-bar"><span id="engine-loading-fill"></span></div>
            <strong id="engine-loading-percent">0%</strong>
          </div>
          <p class="engine-error" id="engine-error" role="alert" hidden>棋手加载失败，请重试</p>
        </section>
        <div class="renderer-error" id="renderer-error" role="alert" hidden></div>
      </main>

      <main class="game-screen" id="game-screen" hidden>
        <h1 class="sr-only">中国象棋 · tako-xiangqi</h1>
        <div class="hud-home">
          <button
            class="hud-button back-button"
            id="btn-menu"
            type="button"
            aria-label="返回主菜单"
            title="返回主菜单"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m14 5-7 7 7 7M7 12h13" />
            </svg>
          </button>
          <span class="hud-mark" aria-hidden="true">中国象棋</span>
        </div>

        <div class="hud-turn">
          <button
            class="hud-button view-button"
            id="btn-view"
            type="button"
            aria-label="恢复视角"
            title="恢复视角"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" />
              <path d="M14.6 11.2A3.2 3.2 0 1 0 15.2 13.5M15.2 10.2v1.3h-1.3" />
            </svg>
          </button>
          <div class="turn-statuses" id="turn-statuses" role="status" aria-label="当前回合">
            <span class="turn-state turn-state-red is-active" id="red-turn-state">红方行棋</span>
            <span class="turn-state turn-state-black" id="black-turn-state">黑方行棋</span>
          </div>
        </div>

        <div class="sr-only" id="selection-note" aria-live="polite" hidden></div>

        <div class="hud-players" aria-label="棋手">
          <span class="player-chip" id="red-player">
            <span class="player-marker" aria-hidden="true"></span>
            <span class="roster" id="red-roster"></span>
          </span>
          <span class="player-chip" id="black-player">
            <span class="player-marker" aria-hidden="true"></span>
            <span class="roster" id="black-roster"></span>
          </span>
        </div>
        <div class="hud-actions">
          <button
            class="hud-button action-button"
            id="btn-undo"
            type="button"
            aria-label="悔棋"
            title="悔棋"
            disabled
          >
            <span>悔棋</span>
          </button>
          <button
            class="hud-button action-button"
            id="btn-new-game"
            type="button"
            aria-label="重开"
            title="重开"
          >
            <span>重开</span>
          </button>
        </div>
      </main>
    </div>

    <dialog
      class="result-dialog"
      id="result-dialog"
      aria-labelledby="result-title"
    >
      <span class="result-emblem" id="result-emblem" aria-hidden="true">帅</span>
      <h2 id="result-title">红方获胜</h2>
      <button class="dialog-button" id="btn-rematch" type="button">
        <span>再来一局</span>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h14m-6-6 6 6-6 6" />
        </svg>
      </button>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
